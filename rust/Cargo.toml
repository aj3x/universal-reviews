[package]
name = "rating-read"
version = "0.1.0"
edition = "2024"
description = "Read-only Rust service for the hottest Custom Rating endpoints, sharing the Node API's SQLite file"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

[profile.release]
lto = "thin"
strip = true
