# Streams every change to the SQLite file to Cloudflare R2.
# Restore: litestream restore -o /data/rating.db s3://$LITESTREAM_BUCKET/rating.db
dbs:
  - path: /data/rating.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: rating.db
        endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
        region: auto
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 720h
