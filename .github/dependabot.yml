version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: cargo
    directory: /rust
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /rust
    schedule: { interval: monthly }
